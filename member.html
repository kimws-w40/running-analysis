<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員首頁 - 跑步與訓練平台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 頂部導覽列 */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .user-info {
            font-size: 0.95rem;
            color: #bdc3c7;
        }

        /* 主要內容區 */
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .welcome-banner {
            margin-bottom: 2rem;
            text-align: center;
        }

        .welcome-banner h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .welcome-banner p {
            color: #7f8c8d;
        }

        /* 功能選項卡片容器 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* 單張卡片樣式 */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .card h2 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 0.8rem;
        }

        .card p {
            color: #7f8c8d;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #ecf0f1;
            color: #7f8c8d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
<header style="background-color: #0f172a; color: white; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <!-- 返回形象首頁 (index.html) 按鈕 -->
        <a href="./index.html" style="background-color: #38bdf8; color: #0f172a; padding: 0.4rem 0.8rem; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">
            ← 返回首頁
        </a>
        <img src="./wanzulogo.png" alt="Wanzu Logo" style="height: 35px; width: auto;">
        <span style="font-size: 1.2rem; font-weight: bold;">Wanzu 會員專區</span>
    </div>

    <div class="user-info">
        <a href="./index.html" style="color: #38bdf8; text-decoration: none;">登出</a>
    </div>
</header>

    <!-- 主要內容 -->
    <main>
        <div class="welcome-banner">
            <h1>歡迎回到您的訓練專區</h1>
            <p>請選擇您今天想要進行的操作</p>
        </div>

        <div class="dashboard-grid">
            <!-- 選項一：跑步分析 -->
            <a href="./analyze.html" class="card">
                <div class="icon">📊</div>
                <h2>跑步分析</h2>
                <p>上傳您的跑步影片，系統將自動進行動作捕捉，產出踝膝髖的角度。</p>
            </a>

           <!-- 選項二：每週肌力任務 -->
            <a href="./game.html" class="card">
                <div class="icon">⚔️</div>
                <h2>每週肌力任務</h2>
                <p>透過鏡頭挑戰三關深蹲魔王（10下 → 20下 → 30下），鍛鍊下肢肌耐力並累積積分！</p>
            </a>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 Running Analysis & Training System. All rights reserved.</p>
    </footer>

</body>
</html>
