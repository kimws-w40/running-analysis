<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深蹲打怪挑戰 - 跑步與訓練平台</title>
    
    <!-- 引入 MediaPipe Pose 必要的函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .back-btn {
            color: #3498db;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: #162447;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .hud {
            margin-bottom: 1rem;
            background: #1f4068;
            padding: 1rem;
            border-radius: 8px;
        }

        .hud h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #e43f5a;
        }

        .hud p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .hp-bar-container {
            width: 100%;
            height: 22px;
            background-color: #333;
            border-radius: 11px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 5px;
        }

        .hp-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.2s ease;
        }

        /* 視訊與畫布容器 */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none; 
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像翻轉 */
        }

        /* 畫面中間的怪獸圖示 */
        .monster-avatar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 5;
            pointer-events: none;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
        }

        .status-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .start-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <a href="./index.html" class="back-btn">← 返回會員首頁</a>
        <h1>⚔️ 深蹲打怪挑戰</h1>
    </header>

    <div class="game-container">
        <!-- 遊戲狀態 HUD -->
        <div class="hud">
            <h2 id="level-title">第一關：小怪來襲</h2>
            <p id="monster-desc">對手: 史萊姆</p>
            <p>本關深蹲目標：<span id="rep-counter">0 / 10</span> | 動作判定：<span id="hit-status" style="color: #f1c40f;">請對準怪獸並深蹲</span></p>
            <div class="hp-bar-container">
                <div id="boss-hp-bar" class="hp-bar"></div>
            </div>
        </div>

        <!-- 視訊與遊戲畫面 -->
        <div class="video-box">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas>
            
            <!-- 中間的怪獸圖示 -->
            <div id="monster-icon" class="monster-avatar">🟢</div>

            <!-- 啟動按鈕層 -->
            <div id="action-status" class="status-overlay">
                <p id="status-text" style="font-size: 1.2rem; margin-bottom: 10px; color: #f1c40f;">請點擊下方按鈕以啟用相機</p>
                <button class="start-btn" onclick="startCamera()">開啟相機並開始遊戲</button>
            </div>
        </div>
    </div>

    <script>
        // 遊戲狀態變數
        let gameState = {
            level: 1,           
            currentReps: 0,     
            targetReps: 10,     
            squatState: "UP"    
        };

        const levelConfigs = {
            1: { name: "第一關：小怪來襲", target: 10, monsterName: "史萊姆", icon: "🟢" },
            2: { name: "第二關：中階護衛", target: 20, monsterName: "獸人戰士", icon: "👹" },
            3: { name: "第三關：深蹲大魔王", target: 30, monsterName: "遠古巨龍", icon: "🐉" }
        };

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusOverlay = document.getElementById('action-status');
        const statusText = document.getElementById('status-text');
        const monsterIcon = document.getElementById('monster-icon');
        const hitStatus = document.getElementById('hit-status');

        // 計算三點夾角
        function calculateAngle(a, b, c) {
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360.0 - angle;
            }
            return angle;
        }

        const POSE_CONNECTIONS = [
            [11, 12], [11, 23], [12, 24], [23, 24], 
            [11, 13], [13, 15], [12, 14], [14, 16], 
            [23, 25], [25, 27], [24, 26], [26, 28]  
        ];

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // 1. 繪製骨架
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeStyle = '#00ffcc';
                for (const connection of POSE_CONNECTIONS) {
                    const start = landmarks[connection[0]];
                    const end = landmarks[connection[1]];
                    if (start && end && (start.visibility > 0.5 && end.visibility > 0.5)) {
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
                        canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
                        canvasCtx.stroke();
                    }
                }

                canvasCtx.fillStyle = '#ff0055';
                for (const landmark of landmarks) {
                    if (landmark.visibility > 0.5) {
                        canvasCtx.beginPath();
                        canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 6, 0, 2 * Math.PI);
                        canvasCtx.fill();
                    }
                }

                // 2. 取得身體中間四個點（雙肩與雙骨盆）計算軀幹中心點
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const rightKnee = landmarks[26];
                const rightAnkle = landmarks[28];

                if (leftShoulder && rightShoulder && leftHip && rightHip && rightKnee && rightAnkle) {
                    // 計算四點中心 (X, Y)
                    let torsoCenterX = (leftShoulder.x + rightShoulder.x + leftHip.x + rightHip.x) / 4;
                    let torsoCenterY = (leftShoulder.y + rightShoulder.y + leftHip.y + rightHip.y) / 4;

                    // 條件 A：身體中心點是否在畫面中央區塊（怪獸附近，X介於 0.3~0.7，Y介於 0.2~0.8）
                    let isTouchingMonster = (torsoCenterX > 0.3 && torsoCenterX < 0.7 && torsoCenterY > 0.2 && torsoCenterY < 0.8);

                    // 條件 B：計算膝蓋角度 (小於 100 度代表深蹲到位)
                    let kneeAngle = calculateAngle(rightHip, rightKnee, rightAnkle);

                    if (isTouchingMonster) {
                        if (kneeAngle > 160) {
                            gameState.squatState = "UP";
                            hitStatus.innerText = "位置正確！請向下深蹲";
                            hitStatus.style.color = "#2ecc71";
                        } else if (kneeAngle < 100 && gameState.squatState === "UP") {
                            gameState.squatState = "DOWN";
                            hitStatus.innerText = "好！站起來攻擊！";
                            hitStatus.style.color = "#f1c40f";
                        } else if (kneeAngle > 150 && gameState.squatState === "DOWN") {
                            gameState.squatState = "UP";
                            onSquatCompleted();
                        }
                    } else {
                        hitStatus.innerText = "請移動身體靠近中央怪獸！";
                        hitStatus.style.color = "#e74c3c";
                    }
                }
            } else {
                hitStatus.innerText = "未偵測到身體，請站在鏡頭前";
                hitStatus.style.color = "#e74c3c";
            }
            canvasCtx.restore();
        }

        // 初始化 MediaPipe
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        async function startCamera() {
            try {
                statusText.innerText = "正在請求相機權限...";
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    predictWebcam();
                    statusOverlay.style.display = "none";
                };
            } catch (err) {
                statusText.innerHTML = `無法開啟相機！<br><span style="font-size:0.9rem; color:#e74c3c;">錯誤: ${err.message}</span>`;
            }
        }

        async function predictWebcam() {
            if (videoElement.readyState >= 2) {
                await pose.send({ image: videoElement });
            }
            requestAnimationFrame(predictWebcam);
        }

        function onSquatCompleted() {
            gameState.currentReps++;
            updateGameUI();

            // 擊中特效：讓怪獸圖示稍微放大彈跳
            monsterIcon.style.transform = "translate(-50%, -50%) scale(1.3)";
            setTimeout(() => {
                monsterIcon.style.transform = "translate(-50%, -50%) scale(1)";
            }, 150);

            if (gameState.currentReps >= gameState.targetReps) {
                levelUp();
            }
        }

        function levelUp() {
            if (gameState.level < 3) {
                gameState.level++;
                gameState.currentReps = 0; 
                gameState.targetReps = levelConfigs[gameState.level].target;
                
                // 更換關卡怪獸圖示
                monsterIcon.innerText = levelConfigs[gameState.level].icon;
                document.getElementById("monster-desc").innerText = `對手: ${levelConfigs[gameState.level].monsterName}`;
                
                alert(`恭喜通關！進入 ${levelConfigs[gameState.level].name}！`);
                updateGameUI();
            } else {
                alert("🎉 太神啦！你成功擊敗了所有魔王，通關全遊戲！");
                resetGame();
            }
        }

        function resetGame() {
            gameState.level = 1;
            gameState.currentReps = 0;
            gameState.targetReps = levelConfigs[1].target;
            monsterIcon.innerText = levelConfigs[1].icon;
            document.getElementById("monster-desc").innerText = `對手: ${levelConfigs[1].monsterName}`;
            updateGameUI();
        }

        function updateGameUI() {
            document.getElementById("level-title").innerText = levelConfigs[gameState.level].name;
            document.getElementById("rep-counter").innerText = `${gameState.currentReps} / ${gameState.targetReps}`;
            
            let hpPercent = ((gameState.targetReps - gameState.currentReps) / gameState.targetReps) * 100;
            if (hpPercent < 0) hpPercent = 0;
            document.getElementById("boss-hp-bar").style.width = `${hpPercent}%`;
        }

        updateGameUI();
    </script>
</body>
</html>
