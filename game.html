<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深蹲打怪挑戰 - 跑步與訓練平台</title>
    
    <!-- 引入 MediaPipe Pose 必要的函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .back-btn {
            color: #3498db;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: #162447;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .hud {
            margin-bottom: 1rem;
            background: #1f4068;
            padding: 1rem;
            border-radius: 8px;
        }

        .hud h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #e43f5a;
        }

        .hud p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .hp-bar-container {
            width: 100%;
            height: 22px;
            background-color: #333;
            border-radius: 11px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 5px;
        }

        .hp-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.2s ease;
        }

        /* 視訊與畫布容器 */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none; /* 隱藏原生影片，改用 Canvas 繪製鏡頭與骨架 */
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像翻轉，操作更直覺 */
        }

        .status-overlay {
            position: absolute;
            bottom: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f1c40f;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <a href="./index.html" class="back-btn">← 返回會員首頁</a>
        <h1>⚔️ 深蹲打怪挑戰 (手機前鏡頭)</h1>
    </header>

    <div class="game-container">
        <!-- 遊戲狀態 HUD -->
        <div class="hud">
            <h2 id="level-title">第一關：小怪來襲</h2>
            <p id="monster-name">對手: 史萊姆</p>
            <p>本關深蹲目標：<span id="rep-counter">0 / 10</span> | 當前膝蓋角度：<span id="angle-display">--</span>°</p>
            <div class="hp-bar-container">
                <div id="boss-hp-bar" class="hp-bar"></div>
            </div>
        </div>

        <!-- 視訊與遊戲畫面 -->
        <div class="video-box">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas>
            <div id="action-status" class="status-overlay">正在請求相機權限...</div>
        </div>
    </div>

    <script>
        // 遊戲狀態變數
        let gameState = {
            level: 1,           
            currentReps: 0,     
            targetReps: 10,     
            squatState: "UP"    // 動作狀態機: "UP" (站立) 或 "DOWN" (下蹲)
        };

        const levelConfigs = {
            1: { name: "第一關：小怪來襲", target: 10, monsterName: "史萊姆" },
            2: { name: "第二關：中階護衛", target: 20, monsterName: "獸人戰士" },
            3: { name: "第三關：深蹲大魔王", target: 30, monsterName: "遠古巨龍" }
        };

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDisplay = document.getElementById('action-status');
        const angleDisplay = document.getElementById('angle-display');

        // 計算三點夾角的數學函式 (以膝蓋為頂點：髖、膝、踝)
        function calculateAngle(a, b, c) {
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360.0 - angle;
            }
            return angle;
        }

        // 當偵測到 MediaPipe 返回骨架結果時觸發
        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const hip = landmarks[24];   // 右髖
                const knee = landmarks[26];  // 右膝
                const ankle = landmarks[28]; // 右踝

                if (hip && knee && ankle) {
                    let kneeAngle = calculateAngle(hip, knee, ankle);
                    angleDisplay.innerText = Math.round(kneeAngle);

                    // 畫出膝蓋追蹤圓點
                    canvasCtx.fillStyle = "#e43f5a";
                    let kneeX = knee.x * canvasElement.width;
                    let kneeY = knee.y * canvasElement.height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(kneeX, kneeY, 12, 0, 2 * Math.PI);
                    canvasCtx.fill();

                    // --- 深蹲狀態機與自動扣血判定邏輯 ---
                    if (kneeAngle > 160) {
                        gameState.squatState = "UP";
                        statusDisplay.innerText = "請下蹲 (UP)";
                        statusDisplay.style.color = "#2ecc71";
                    } else if (kneeAngle < 100 && gameState.squatState === "UP") {
                        gameState.squatState = "DOWN";
                        statusDisplay.innerText = "好！站起來！(DOWN)";
                        statusDisplay.style.color = "#f1c40f";
                    } else if (kneeAngle > 150 && gameState.squatState === "DOWN") {
                        gameState.squatState = "UP";
                        onSquatCompleted();
                    }
                }
            } else {
                statusDisplay.innerText = "未偵測到身體，請退後讓鏡頭拍到全身！";
                statusDisplay.style.color = "#e74c3c";
            }
            canvasCtx.restore();
        }

        // 初始化 MediaPipe Pose
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // 使用標準 Web API 啟動手機前鏡頭
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user", // 強制使用前鏡頭
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    predictWebcam();
                };
                statusDisplay.innerText = "相機已啟動，請站到鏡頭前！";
            } catch (err) {
                console.error("無法開啟相機: ", err);
                statusDisplay.innerText = "無法存取相機，請檢查權限或確認網址為 HTTPS！";
            }
        }

        // 循環偵測函數
        async function predictWebcam() {
            if (videoElement.readyState >= 2) {
                await pose.send({ image: videoElement });
            }
            requestAnimationFrame(predictWebcam);
        }

        // 完成一下深蹲的後續處理
        function onSquatCompleted() {
            gameState.currentReps++;
            updateGameUI();

            if (gameState.currentReps >= gameState.targetReps) {
                levelUp();
            }
        }

        // 關卡推進
        function levelUp() {
            if (gameState.level < 3) {
                gameState.level++;
                gameState.currentReps = 0; 
                gameState.targetReps = levelConfigs[gameState.level].target;
                alert(`恭喜通關！進入 ${levelConfigs[gameState.level].name}，目標 ${gameState.targetReps} 下！`);
                updateGameUI();
            } else {
                alert("🎉 太神啦！你成功擊敗了所有魔王，通關全遊戲！");
                resetGame();
            }
        }

        function resetGame() {
            gameState.level = 1;
            gameState.currentReps = 0;
            gameState.targetReps = levelConfigs[1].target;
            updateGameUI();
        }

        // 更新畫面 UI 與血條
        function updateGameUI() {
            document.getElementById("level-title").innerText = levelConfigs[gameState.level].name;
            document.getElementById("monster-name").innerText = `對手: ${levelConfigs[gameState.level].monsterName}`;
            document.getElementById("rep-counter").innerText = `${gameState.currentReps} / ${gameState.targetReps}`;
            
            let hpPercent = ((gameState.targetReps - gameState.currentReps) / gameState.targetReps) * 100;
            if (hpPercent < 0) hpPercent = 0;
            document.getElementById("boss-hp-bar").style.width = `${hpPercent}%`;
        }

        // 啟動相機
        startCamera();
        updateGameUI();
    </script>
</body>
</html>
